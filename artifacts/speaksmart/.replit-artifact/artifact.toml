kind = "web"
previewPath = "/"
title = "SPEAKSMART"
version = "1.0.0"
id = "artifacts/speaksmart"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19907

[services.development]
run = "pnpm --filter @workspace/speaksmart run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/speaksmart", "run", "build" ]
publicDir = "artifacts/speaksmart/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19907"
BASE_PATH = "/"
