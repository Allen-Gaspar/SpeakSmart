kind = "mobile"
previewPath = "/mobile/"
title = "SPEAKSMART Mobile"
version = "1.0.0"
id = "artifacts/speaksmart-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19979

[services.development]
run = "pnpm --filter @workspace/speaksmart-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/speaksmart-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/speaksmart-mobile", "run", "serve" ]

[services.env]
PORT = "19979"
BASE_PATH = "/mobile/"
